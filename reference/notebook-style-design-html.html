<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Interview Notebook</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Lora:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf9f1;--desk:#8fa3b8;--card:#fffffb;--ink:#1f2a44;--muted:#667089;--rule:#cfdff0;--margin:#f08c8c;--shadow:rgba(31,42,68,.22);--tape:rgba(255,222,89,.7);--hl:#fff08a;--n0:#fff1a8;--n1:#c9efd8;--n2:#cfe0ff;--n3:#ffd5dc;--pen:#2a4fc2;color-scheme:light;
padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#23262d;--desk:#14161b;--card:#2c3039;--ink:#ece8dc;--muted:#a3a9b8;--rule:#323846;--margin:#a4545a;--shadow:rgba(0,0,0,.5);--tape:rgba(200,170,60,.6);--hl:#6a5f1a;--n0:#5d5424;--n1:#2f5742;--n2:#34497a;--n3:#6b3a45;--pen:#8fb0ff;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#23262d;--desk:#14161b;--card:#2c3039;--ink:#ece8dc;--muted:#a3a9b8;--rule:#323846;--margin:#a4545a;--shadow:rgba(0,0,0,.5);--tape:rgba(200,170,60,.6);--hl:#6a5f1a;--n0:#5d5424;--n1:#2f5742;--n2:#34497a;--n3:#6b3a45;--pen:#8fb0ff;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:var(--desk);color:var(--ink);font-family:"Lora",Georgia,serif;line-height:1.65}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,summary:focus-visible{outline:3px solid var(--pen);outline-offset:3px}
.book{max-width:1020px;margin:18px auto;min-height:calc(100vh - 36px);background:var(--paper) repeating-linear-gradient(transparent 0 31px,var(--rule) 31px 32px);background-attachment:local;border-radius:6px 14px 14px 6px;box-shadow:0 14px 34px var(--shadow),inset 14px 0 18px -14px var(--shadow);position:relative;padding:20px 22px 60px 74px}
.book::before{content:"";position:absolute;left:54px;top:0;bottom:0;width:2px;background:var(--margin)}
.holes{position:absolute;left:14px;top:40px;bottom:40px;display:flex;flex-direction:column;justify-content:space-around}
.holes i{width:18px;height:18px;border-radius:50%;background:var(--desk);box-shadow:inset 2px 2px 4px var(--shadow)}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;min-height:64px}
.logo{font-family:"Caveat",cursive;font-size:2rem;font-weight:700;color:var(--pen);text-decoration:none;transform:rotate(-2deg);display:inline-block}
.crumbs{font-family:"Patrick Hand",cursive;font-size:1.15rem;color:var(--muted)}
.crumbs a{color:var(--pen)}
h1,h2,h3{font-family:"Caveat",cursive;line-height:1.1;margin:0}
h1{font-size:clamp(2.4rem,6vw,3.8rem)}
h2{font-size:2.3rem}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%)}
.lead{font-size:1.05rem;max-width:56ch;margin:.4rem 0 1.2rem;color:var(--muted)}
.ui{font-family:"Patrick Hand","Segoe Print",cursive;font-size:1.1rem}
.sketch{border:2px solid var(--ink);border-radius:255px 14px 225px 14px/14px 225px 14px 255px;background:var(--card);box-shadow:4px 5px 0 var(--shadow)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:26px 22px;margin-top:22px}
.tcard{position:relative;text-align:left;padding:26px 20px 18px;transform:rotate(var(--r,0deg));transition:transform .25s,box-shadow .25s}
.tcard:hover{transform:rotate(0) translateY(-6px) scale(1.02);box-shadow:7px 10px 0 var(--shadow)}
.tcard::before,.note::before{content:"";position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:var(--tape);transform:rotate(var(--t,-3deg))}
.tcard .ic{font-size:2.4rem;display:block;transition:transform .3s}
.tcard:hover .ic{transform:rotate(-14deg) scale(1.2)}
.tcard h3{font-size:1.9rem;margin-top:6px}
.tcard p{margin:.2rem 0 .6rem;font-size:.92rem;color:var(--muted)}
.chip{display:inline-block;font-family:"Patrick Hand",cursive;font-size:1rem;padding:0 10px;border-radius:12px;background:var(--n2);margin:2px 4px 2px 0}
.note{position:relative;background:var(--n0);padding:20px 20px 14px;max-width:560px;margin-top:18px;transform:rotate(1.2deg);box-shadow:3px 5px 8px var(--shadow);border-radius:3px}
.note b{font-family:"Caveat",cursive;font-size:1.6rem}
.note .ans{margin-top:8px;padding-top:8px;border-top:2px dashed var(--ink)}
.btn{font-family:"Patrick Hand",cursive;font-size:1.1rem;padding:3px 16px;background:var(--card);border:2px solid var(--ink);border-radius:20px 8px 18px 8px;box-shadow:2px 3px 0 var(--shadow);transition:transform .15s}
.btn:hover{transform:translate(-1px,-2px) rotate(-1deg)}.btn:active{transform:translate(2px,2px);box-shadow:none}
.btn.go{background:var(--n1)}.btn.no{background:var(--n3)}
.subs{display:grid;gap:14px;margin-top:20px;max-width:700px}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 18px;text-align:left;width:100%;transition:transform .2s}
.srow:hover{transform:translateX(10px) rotate(-.5deg)}
.srow h3{font-size:1.7rem}.srow small{color:var(--muted)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:18px 0 0}
.tab{font-family:"Patrick Hand",cursive;font-size:1.15rem;padding:4px 14px 2px;border:2px solid var(--ink);border-bottom:0;border-radius:14px 14px 0 0;background:var(--n2);opacity:.75}
.tab[aria-selected="true"]{background:var(--card);opacity:1;transform:translateY(2px);position:relative;z-index:2}
.panel{background:var(--card);border:2px solid var(--ink);border-radius:0 14px 14px 14px;padding:22px;box-shadow:4px 5px 0 var(--shadow);min-height:260px}
details{margin:0 0 12px;border-left:5px solid var(--pen);padding:2px 0 2px 14px}
summary{cursor:pointer;font-family:"Patrick Hand",cursive;font-size:1.3rem;list-style:none}
summary::before{content:"❓ "}details[open] summary::before{content:"💡 "}
details p{margin:.4rem 0 .2rem}
.scene{perspective:1200px;max-width:460px;margin:6px auto 14px;height:250px}
.c3d{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.3,.5,1);transform-style:preserve-3d;cursor:pointer;background:none;border:0;padding:0;display:block}
.c3d.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:22px;text-align:center;font-size:1.15rem}
.face small{font-family:"Patrick Hand",cursive;color:var(--muted);position:absolute;bottom:10px}
.face.back{transform:rotateY(180deg);background:var(--n1)}
.face.front{background:var(--n0)}
.face .q{font-family:"Caveat",cursive;font-size:2rem;line-height:1.15}
.bar{height:14px;border:2px solid var(--ink);border-radius:10px;overflow:hidden;max-width:460px;margin:0 auto 12px}
.bar i{display:block;height:100%;background:var(--n1);width:0;transition:width .4s}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.pop{position:fixed;pointer-events:none;font-size:1.6rem;z-index:50;animation:pop .9s ease-out forwards}
@keyframes pop{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.svgw{overflow-x:auto}
svg{max-width:100%;height:auto;min-width:420px}
svg text{font-family:"Patrick Hand",cursive;font-size:15px;fill:var(--ink);text-anchor:middle}
svg .nd{stroke:var(--ink);stroke-width:2.2;rx:10}
svg .ed{stroke:var(--ink);stroke-width:2;stroke-dasharray:6 4;fill:none;animation:dash 1.2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.ex h3{font-size:1.7rem;margin:1rem 0 .2rem}.ex p,.ex li{max-width:68ch}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--hl);padding:0 5px;border-radius:4px}
.step{position:relative;display:block;width:100%;text-align:left;margin:0 0 16px;padding:14px 18px 12px 62px}
.step .no{position:absolute;left:14px;top:10px;font-family:"Caveat",cursive;font-size:2.2rem;color:var(--pen)}
.step h3{font-size:1.6rem}
.step p{margin:.2rem 0 0;font-size:.95rem}
.step.done{background:var(--n1)}.step.done h3{text-decoration:line-through}
.step.done::after{content:"covered ✓";position:absolute;right:14px;top:10px;font-family:"Caveat",cursive;font-size:1.4rem;color:var(--pen);transform:rotate(-8deg);border:2px solid var(--pen);border-radius:8px;padding:0 8px}
.back-l{font-family:"Patrick Hand",cursive;font-size:1.15rem;color:var(--pen);background:none;border:0;padding:0}
@media (max-width:640px){.book{margin:0;border-radius:0;padding:14px 14px 50px 38px}.book::before{left:26px}.holes{display:none}.panel{padding:16px}.scene{height:230px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="book"><div class="holes"><i></i><i></i><i></i><i></i><i></i></div>
<div class="top"><a class="logo" href="#">Interview Notebook</a><nav class="crumbs" id="crumbs"></nav></div>
<main id="app"></main></div>
<script>
var D=[
{id:"lld",ic:"🧩",name:"Low Level Design",blurb:"Classes, patterns and clean object models.",r:"-1.5deg",subs:[
{id:"observer",name:"Observer Pattern",tag:"Behavioral pattern",
qa:[["What problem does Observer solve?","One object (the subject) notifies many dependents when its state changes, without knowing who they are. That keeps coupling loose."],["Push vs pull model?","Push sends the changed data with the notification. Pull only says “something changed” and observers ask for what they need. Pull is more flexible; push is cheaper."],["Real-world examples?","DOM event listeners, RxJS observables, Angular’s EventEmitter, stock tickers, YouTube subscriptions."],["Common pitfall?","Memory leaks from observers that never unsubscribe (the lapsed listener problem)."]],
cards:[["Observer: intent?","One-to-many dependency. Dependents are notified automatically on change."],["Subject vs Observer?","The subject holds state and a list of observers. An observer exposes update()."],["Biggest risk?","Forgotten unsubscribes, which leak memory."]],
ex:"<p>Think of a newsletter. The publisher keeps a list of subscribers and sends every one of them an email when something new is out. The publisher never needs to know what each subscriber does with it.</p><h3>Pieces</h3><ul><li><code>Subject</code> keeps observers, with <code>attach()</code>, <code>detach()</code> and <code>notify()</code>.</li><li><code>Observer</code> is an interface with <code>update()</code>.</li><li>Concrete observers react in their own way.</li></ul><h3>Use it when</h3><p>A change in one object must update others, and you don’t know up front how many others there are.</p>",
dia:{w:520,h:250,n:{s:[185,20,150,62,"Subject|(Publisher)",0],a:[20,170,130,56,"Observer A",1],b:[195,170,130,56,"Observer B",1],c:[370,170,130,56,"Observer C",1]},e:[["s","a","notify()"],["s","b",""],["s","c",""]]}},
{id:"singleton",name:"Singleton",tag:"Creational pattern",
qa:[["What is a Singleton?","A class that allows exactly one instance and gives a global access point to it."],["How do you make it thread-safe?","Create the instance eagerly, use double-checked locking, or use a holder class or enum (in Java). In JavaScript, a module is already a singleton."],["Why do people dislike it?","Hidden global state, hard-to-mock tests and tight coupling. Prefer dependency injection with a single-scope provider. Angular’s <code>providedIn: 'root'</code> does this."]],
cards:[["Singleton: two rules?","Private constructor, plus a static getInstance()."],["Lazy vs eager?","Lazy builds on first use. Eager builds at class load, which is simpler and thread-safe."]],
ex:"<p>Use a Singleton for things where a second copy would be a bug: a config registry, a logger, a connection pool manager.</p><h3>Trade-off</h3><p>You gain a guaranteed single instance. You pay with global state that makes unit tests harder.</p>",
dia:{w:480,h:210,n:{c:[120,10,240,190,"Singleton|– – – – – – – –|- instance: Singleton|– – – – – – – –|- Singleton()|+ getInstance()|+ doWork()",3]},e:[]}},
{id:"parking",name:"Design a Parking Lot",tag:"Classic LLD problem",
cs:{t:"Walk through it in this order",s:[["Clarify requirements","Vehicle types, multiple floors, pricing model, entry and exit gates. Confirm what is out of scope."],["List the entities","ParkingLot, Floor, Spot (compact, regular, large), Vehicle, Ticket, Payment."],["Define the relationships","A lot has many floors, a floor has many spots, and a ticket links a vehicle to a spot."],["Pick the patterns","Strategy for pricing, Factory for vehicles, Singleton for the lot."],["Cover the edge cases","Lot full, lost ticket, concurrent entry at two gates, EV charging spots."]]}}
]},
{id:"hld",ic:"🏗️",name:"System Design",blurb:"Scale, storage, caching and trade-offs.",r:"1.2deg",subs:[
{id:"urlshort",name:"URL Shortener",tag:"Case study",
qa:[["How do you generate short codes?","Base62-encode a unique ID from a counter service, or hash the URL and keep the first 7 characters, checking for collisions."],["301 or 302 redirect?","301 is cached by browsers, which cuts load. 302 lets you count every click. Pick by whether analytics matter."],["How do you scale reads?","Reads far outnumber writes, so put a cache in front of the database and use read replicas."]],
dia:{w:580,h:300,n:{cl:[15,125,90,50,"Client",2],lb:[150,125,100,50,"Load|Balancer",0],ap:[300,40,110,50,"App Server",1],ca:[300,210,110,50,"Redis Cache",3],db:[460,125,100,50,"Database",2]},e:[["cl","lb",""],["lb","ap",""],["ap","ca","hot links"],["ap","db","miss"],["ca","db",""]]},
cs:{t:"Interview flow",s:[["Requirements","Shorten, redirect, optional custom alias and expiry. Roughly 100M new URLs per month, with reads 100 times writes."],["Estimate","About 40 writes per second and 4,000 reads per second. Seven Base62 characters give 3.5 trillion codes."],["High-level design","Clients hit an app tier behind a load balancer. The app tier uses a cache and a key-value store."],["Deep dive","ID generation, cache eviction (LRU), database sharding by code."],["Trade-offs","Hash collisions vs a central counter, 301 vs 302, SQL vs NoSQL."]]}},
{id:"caching",name:"Caching",tag:"Building block",
cards:[["Cache-aside?","The app checks the cache first, and on a miss reads the database and fills the cache."],["Write-through?","Writes go to the cache and database together. Reads are fast and consistent, writes are slower."],["Common eviction policies?","LRU, LFU and TTL-based expiry."]],
ex:"<p>A cache keeps copies of expensive-to-fetch data close to where it is used. The hard part is not adding a cache, it is deciding <b>when a copy is stale</b>.</p><h3>Watch out for</h3><ul><li>Cache stampede when a hot key expires, fixed with locking or jittered TTLs.</li><li>Stale reads after writes.</li></ul>",
dia:{w:520,h:210,n:{cl:[15,80,100,50,"Client",2],ap:[190,80,110,50,"App",1],ca:[380,15,120,50,"Cache|(Redis)",0],db:[380,145,120,50,"Database",3]},e:[["cl","ap",""],["ap","ca","1. check"],["ap","db","2. on miss"]]}},
{id:"lb",name:"Load Balancing",tag:"Building block",
qa:[["Layer 4 vs Layer 7?","L4 routes on IP and port and is very fast. L7 reads HTTP, so it can route by path or header."],["Common algorithms?","Round robin, least connections, IP hash and weighted variants."]],
cards:[["Sticky sessions?","Send a user to the same server each time. Simple, but it hurts even distribution and failover."],["Health checks?","The balancer pings servers and stops routing to unhealthy ones."]]}
]},
{id:"ang",ic:"🅰️",name:"Angular",blurb:"Framework questions you will actually get asked.",r:"-.8deg",subs:[
{id:"cd",name:"Change Detection",tag:"Core concept",
qa:[["Default vs OnPush?","Default checks every component on every event. OnPush checks a component only when an input reference changes, an event fires inside it, or an async pipe emits."],["What do signals change?","Signals let Angular update only the views that read them, which makes fine-grained updates possible."]],
cards:[["What triggers change detection?","Browser events, timers, XHR and fetch, patched by Zone.js."],["Why OnPush is faster?","It skips whole subtrees that cannot have changed."]],
ex:"<p>Angular walks the component tree and compares template bindings with their previous values. <code>OnPush</code> plus immutable data lets it skip most of that walk.</p>"},
{id:"rxjs",name:"RxJS Basics",tag:"Streams",
qa:[["switchMap vs mergeMap?","switchMap cancels the previous inner stream, good for search typeahead. mergeMap runs them all in parallel."],["How do you avoid leaks?","Use the async pipe, <code>takeUntilDestroyed()</code> or <code>take(1)</code>."]],
cards:[["Cold vs hot observable?","Cold starts a producer per subscriber. Hot shares one producer."],["debounceTime?","Waits for a quiet period before emitting the latest value."]]}
]},
{id:"dsa",ic:"🌳",name:"DSA Patterns",blurb:"Recognise the pattern, then code it.",r:"1.6deg",subs:[
{id:"twoptr",name:"Two Pointers",tag:"Array pattern",
qa:[["When should I use it?","Sorted arrays or strings where you look for pairs, or need to partition or shrink a window from both ends."],["Complexity?","Usually O(n) time and O(1) extra space."]],
cards:[["Two-sum on a sorted array?","Left and right pointers. If the sum is too big, move right in. If too small, move left up."],["Signal words?","Sorted, pair, palindrome, in-place."]],
ex:"<p>Instead of checking every pair (O(n²)), place one pointer at each end and move them based on what you see. Each step discards at least one candidate for good.</p>"}
]}
];
var $=function(i){return document.getElementById(i)},tab="",ci=0,fl=false,known={},done={},qd=null;
function sub(t,s){return t.subs.filter(function(x){return x.id===s})[0]}
function mats(s){var m=[];if(s.qa)m.push(["qa","❓ Q&amp;A"]);if(s.cards)m.push(["cards","🃏 Flashcards"]);if(s.dia)m.push(["dia","📐 Diagram"]);if(s.ex)m.push(["ex","📖 Explain"]);if(s.cs)m.push(["cs","🗂️ Case study"]);return m}
function chips(s){return mats(s).map(function(m){return '<span class="chip">'+m[1]+'</span>'}).join("")}
function allQ(){var a=[];D.forEach(function(t){t.subs.forEach(function(s){(s.qa||[]).forEach(function(q){a.push({q:q[0],a:q[1],p:t.id+"."+s.id,n:s.name})})})});return a}
function newQ(){var a=allQ();qd=a[Math.floor(Math.random()*a.length)];qd.show=false}
function render(){
 var h=location.hash.slice(1).split("."),t=D.filter(function(x){return x.id===h[0]})[0],s=t&&h[1]?sub(t,h[1]):null,out="",c='<a href="#">Home</a>';
 if(t)c+=' / '+(s?'<a href="#'+t.id+'">'+t.name+'</a> / '+s.name:t.name);
 $("crumbs").innerHTML=c;
 if(!t){out=home()}else if(!s){out=topic(t)}else{out=material(t,s)}
 $("app").innerHTML=out;window.scrollTo(0,0)}
function home(){
 if(!qd)newQ();
 var o='<h1 style="margin-top:14px">What are you <span class="hl">cracking</span> today?</h1><p class="lead">Pick a notebook, open a subject and study it as questions, flashcards, diagrams or a full case study.</p>';
 o+='<div class="note" id="qd"></div><div class="grid">';
 D.forEach(function(t){var n=t.subs.length;o+='<button class="tcard sketch" style="--r:'+t.r+'" onclick="location.hash=\''+t.id+'\'"><span class="ic">'+t.ic+'</span><h3>'+t.name+'</h3><p>'+t.blurb+'</p><span class="chip">'+n+(n>1?' subjects':' subject')+'</span></button>'});
 return o+'</div>'}
function qdHtml(){return '<b>Question of the day</b><div>'+qd.q+'</div>'+(qd.show?'<div class="ans">'+qd.a+'<br><a class="ui" href="#'+qd.p+'">Open '+qd.n+'</a></div>':'')+'<div class="row" style="justify-content:flex-start;margin-top:10px"><button class="btn go" onclick="qd.show=!qd.show;$(\'qd\').innerHTML=qdHtml()">'+(qd.show?'Hide answer':'Show answer')+'</button><button class="btn" onclick="newQ();$(\'qd\').innerHTML=qdHtml()">Another one</button></div>'}
function topic(t){
 var o='<h1><span style="font-size:.8em">'+t.ic+'</span> '+t.name+'</h1><p class="lead">'+t.blurb+' Choose a subject to open its notes.</p><div class="subs">';
 t.subs.forEach(function(s){o+='<button class="srow sketch" onclick="location.hash=\''+t.id+'.'+s.id+'\'"><span><h3>'+s.name+'</h3><small>'+s.tag+'</small></span><span>'+chips(s)+'</span></button>'});
 return o+'</div>'}
function material(t,s){
 var m=mats(s);if(!tab||!m.some(function(x){return x[0]===tab}))tab=m[0][0];
 var o='<button class="back-l" onclick="location.hash=\''+t.id+'\'">Back to '+t.name+'</button><h2 style="margin-top:6px">'+s.name+'</h2><div class="ui" style="color:var(--muted)">'+s.tag+'</div><div class="tabs" role="tablist">';
 m.forEach(function(x){o+='<button class="tab" role="tab" aria-selected="'+(tab===x[0])+'" onclick="tab=\''+x[0]+'\';ci=0;fl=false;render2()">'+x[1]+'</button>'});
 return o+'</div><div class="panel" id="panel">'+panel(s)+'</div>'}
function render2(){var h=location.hash.slice(1).split("."),t=D.filter(function(x){return x.id===h[0]})[0];$("app").innerHTML=material(t,sub(t,h[1]))}
function panel(s){
 if(tab==="qa")return s.qa.map(function(q){return '<details><summary>'+q[0]+'</summary><p>'+q[1]+'</p></details>'}).join("");
 if(tab==="ex")return '<div class="ex">'+s.ex+'</div>';
 if(tab==="dia")return '<div class="svgw">'+dia(s.dia)+'</div><p class="ui" style="color:var(--muted);margin:8px 0 0">Dashed lines show the direction of the flow.</p>';
 if(tab==="cs")return '<p class="ui" style="margin-top:0">'+s.cs.t+'. Click a step when you can explain it out loud.</p>'+s.cs.s.map(function(x,i){var k=s.id+i;return '<button class="step sketch'+(done[k]?' done':'')+'" onclick="done[\''+k+'\']=!done[\''+k+'\'];this.classList.toggle(\'done\')"><span class="no">'+(i+1)+'</span><h3>'+x[0]+'</h3><p>'+x[1]+'</p></button>'}).join("");
 var kn=known[s.id]||(known[s.id]={}),n=s.cards.length,c=s.cards[ci],g=Object.keys(kn).filter(function(k){return kn[k]}).length;
 return '<div class="ui" style="text-align:center">Card '+(ci+1)+' of '+n+', mastered '+g+'</div><div class="bar"><i style="width:'+(g/n*100)+'%"></i></div><div class="scene"><button class="c3d'+(fl?' flip':'')+'" id="c3d" onclick="fl=!fl;this.classList.toggle(\'flip\')" aria-label="Flip card"><div class="face front sketch"><span class="q">'+c[0]+'</span><small>tap to flip</small></div><div class="face back sketch">'+c[1]+'</div></button></div><div class="row"><button class="btn" onclick="mv(-1)">Previous</button><button class="btn no" onclick="mark(false)">Again</button><button class="btn go" onclick="mark(true,event)">Got it</button><button class="btn" onclick="mv(1)">Next</button><button class="btn" onclick="shuf()">Shuffle</button></div>'}
function cur(){var h=location.hash.slice(1).split("."),t=D.filter(function(x){return x.id===h[0]})[0];return sub(t,h[1])}
function mv(d){var s=cur();ci=(ci+d+s.cards.length)%s.cards.length;fl=false;$("panel").innerHTML=panel(s)}
function mark(ok,e){var s=cur();known[s.id][ci]=ok;if(ok&&e)pop(e);mv(1)}
function shuf(){var s=cur();s.cards.sort(function(){return Math.random()-.5});known[s.id]={};ci=0;fl=false;$("panel").innerHTML=panel(s)}
function pop(e){["🎉","⭐","✨","📌","🎈","💡"].forEach(function(em,i){var p=document.createElement("span");p.className="pop";p.textContent=em;p.style.left=e.clientX+"px";p.style.top=e.clientY+"px";p.style.setProperty("--dx",(i-2.5)*34+"px");p.style.setProperty("--dy",-60-Math.random()*70+"px");p.style.setProperty("--rot",(i-2.5)*30+"deg");document.body.appendChild(p);setTimeout(function(){p.remove()},950)})}
function dia(d){
 var s='<svg viewBox="0 0 '+d.w+' '+d.h+'" role="img" aria-label="System diagram"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="var(--ink)"/></marker></defs>';
 d.e.forEach(function(e){var A=d.n[e[0]],B=d.n[e[1]],ax=A[0]+A[2]/2,ay=A[1]+A[3]/2,bx=B[0]+B[2]/2,by=B[1]+B[3]/2,x1,y1,x2,y2;
  if(Math.abs(by-ay)>=Math.abs(bx-ax)*.6){x1=ax;x2=bx;if(by>ay){y1=A[1]+A[3];y2=B[1]}else{y1=A[1];y2=B[1]+B[3]}}else{y1=ay;y2=by;if(bx>ax){x1=A[0]+A[2];x2=B[0]}else{x1=A[0];x2=B[0]+B[2]}}
  s+='<path class="ed" d="M'+x1+' '+y1+'L'+x2+' '+y2+'" marker-end="url(#ar)"/>';
  if(e[2])s+='<text x="'+((x1+x2)/2)+'" y="'+((y1+y2)/2-6)+'" style="font-size:13px;fill:var(--pen)">'+e[2]+'</text>'});
 for(var k in d.n){var n=d.n[k],L=n[4].split("|"),y=n[1]+n[3]/2-(L.length-1)*9+5;
  s+='<rect class="nd" x="'+n[0]+'" y="'+n[1]+'" width="'+n[2]+'" height="'+n[3]+'" fill="var(--n'+n[5]+')"/>';
  L.forEach(function(l,i){s+='<text x="'+(n[0]+n[2]/2)+'" y="'+(y+i*18)+'">'+l+'</text>'})}
 return s+'</svg>'}
